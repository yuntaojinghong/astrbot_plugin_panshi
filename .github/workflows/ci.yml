name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run selftest
        run: python _selftest.py

      # 版本号要三处一致：metadata.yaml（面板实际显示的那个）、
      # pages_service 的兜底值、以及 tag。之前没有这条检查，
      # 只改一处也不会报错，面板上的版本号就会和实际装的版本对不上。
      - name: 版本号一致性（metadata.yaml / pages_service.py）
        run: |
          python - <<'PY'
          import re, sys, pathlib
          meta = pathlib.Path("metadata.yaml").read_text(encoding="utf-8")
          m = re.search(r"^version:\s*(\S+)\s*$", meta, re.M)
          svc = pathlib.Path("pages_service.py").read_text(encoding="utf-8")
          s = re.search(r'FALLBACK_VERSION\s*=\s*"([^"]+)"', svc)
          got = {"metadata.yaml": m.group(1) if m else None,
                 "pages_service.py": s.group(1) if s else None}
          if None in got.values() or len(set(got.values())) != 1:
              print("版本号不一致（两处必须相同，改一处就要改另一处）:", got)
              sys.exit(1)
          print(f"版本号一致：{got['metadata.yaml']}")
          PY

      - name: 面板前端测试（jsdom）
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          node tests/test_panel_frontend.js
          node tests/shop_ui.test.js

      - name: 市场审查规则校验（logger 来源 + 禁止内置 logging）
        run: |
          python - <<'PY'
          # 审查方要求：logger 必须且只能从 astrbot.api 导入，严禁内置 logging。
          # 只检查随包分发的代码（_selftest.py 不随包分发，允许自用 logging）。
          import pathlib, re, sys
          SKIP = {"tests", "scripts", ".github", "docs", "dist", "__pycache__"}
          SKIP_FILES = {"_selftest.py"}
          RULES = [
              ("import logging", re.compile(r"^\s*import\s+logging\s*$", re.M)),
              ("from logging", re.compile(r"^\s*from\s+logging\b", re.M)),
              ("logging.getLogger", re.compile(r"logging\s*\.\s*getLogger")),
              ("logging.<level>()", re.compile(
                  r"\blogging\s*\.\s*(?:info|warning|error|debug|exception|critical)\s*\(")),
          ]
          bad = []
          for path in pathlib.Path(".").rglob("*.py"):
              if SKIP & set(path.parts) or path.name in SKIP_FILES:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for label, pat in RULES:
                  for m in pat.finditer(text):
                      line = text[: m.start()].count("\n") + 1
                      bad.append(f"{path}:{line} <{label}> {text.splitlines()[line-1].strip()[:70]}")
          if bad:
              print("发现违反市场审查规则的写法：")
              for item in bad:
                  print("  ", item)
              sys.exit(1)
          print("OK: logger 只从 astrbot.api 导入")
          PY
