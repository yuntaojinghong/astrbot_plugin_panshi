name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run selftest
        run: python _selftest.py

      - name: Build packages
        run: python scripts/build_release.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 用仓库主人的 PAT 创建 release，发布者即显示为仓库主人本人。
          # 不传时 action 回落到内置 GITHUB_TOKEN，它属于 github-actions[bot]，
          # release 页面就会显示成机器人发布的。
          # secret 缺失时自动回退到 GITHUB_TOKEN，workflow 仍然可用。
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          files: |
            dist/astrbot_plugin_panshi.zip
            dist/astrbot_plugin_panshi.tar.gz
          generate_release_notes: true
